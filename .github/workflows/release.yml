name: Release

on:
  pull_request:
    types:
      - closed
    branches:
      - development
      - staging
      - main

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force origin

      # --------------------------------------------------
      # Calculate channel version (alpha / beta / stable)
      # --------------------------------------------------
      - name: Calculate next release version
        id: version
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          echo "Target branch: $BASE_BRANCH"
          echo "Source branch: $HEAD_BRANCH"

          latest_alpha=$(
            git tag --list 'v*-alpha' --sort=-version:refname | head -n 1
          )
          latest_beta=$(
            git tag --list 'v*-beta' --sort=-version:refname | head -n 1
          )
          latest_stable=$(
            git tag --list 'v*' --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1 || true
          )

          echo "Latest alpha: ${latest_alpha:-none}"
          echo "Latest beta: ${latest_beta:-none}"
          echo "Latest stable: ${latest_stable:-none}"

          if [ "$BASE_BRANCH" = "development" ]; then
            channel="alpha"
            suffix="-alpha"
            prerelease="true"
            previous_tag="${latest_alpha:-v0.0.0-alpha}"
          elif [ "$BASE_BRANCH" = "staging" ]; then
            channel="beta"
            suffix="-beta"
            prerelease="true"
            previous_tag="${latest_beta:-v0.0.0-beta}"
          else
            channel="stable"
            suffix=""
            prerelease="false"
            previous_tag="${latest_stable:-v0.0.0}"
          fi

          # Changelog compare follows the source branch when that
          # branch has its own channel tag; otherwise use this channel.
          if [ "$HEAD_BRANCH" = "development" ] && [ -n "$latest_alpha" ]; then
            compare_from="$latest_alpha"
          elif [ "$HEAD_BRANCH" = "staging" ] && [ -n "$latest_beta" ]; then
            compare_from="$latest_beta"
          elif [ "$HEAD_BRANCH" = "main" ] && [ -n "$latest_stable" ]; then
            compare_from="$latest_stable"
          else
            compare_from="$previous_tag"
          fi

          version="${previous_tag#v}"
          version="${version%-alpha}"
          version="${version%-beta}"

          IFS='.' read -r major minor patch <<< "$version"

          patch=$((patch + 1))

          next_version="v${major}.${minor}.${patch}${suffix}"

          echo "Channel: $channel"
          echo "Previous channel tag: $previous_tag"
          echo "Compare from: $compare_from"
          echo "Next release: $next_version"

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "target_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "compare_from=$compare_from" >> "$GITHUB_OUTPUT"
          echo "next_version=$next_version" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Get release commit
      # --------------------------------------------------
      - name: Get release commit
        id: release_commit
        run: |
          release_commit="${{ github.event.pull_request.merge_commit_sha }}"

          echo "Release commit: $release_commit"

          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # Find PRs included in this release
      # --------------------------------------------------
      - name: Find PRs included in release
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.version.outputs.latest_tag }}
          COMPARE_FROM: ${{ steps.version.outputs.compare_from }}
          RELEASE_COMMIT: ${{ steps.release_commit.outputs.release_commit }}
        run: |
          echo "Finding commits between:"
          echo "Previous channel tag: $PREVIOUS_TAG"
          echo "Compare from: $COMPARE_FROM"
          echo "Current release commit: $RELEASE_COMMIT"

          : > release-commits.txt

          if git rev-parse "$PREVIOUS_TAG" >/dev/null 2>&1; then
            git log --format="%H" "$PREVIOUS_TAG..$RELEASE_COMMIT" \
              > release-commits.txt
          elif git rev-parse "$COMPARE_FROM" >/dev/null 2>&1; then
            git log --format="%H" "$COMPARE_FROM..$RELEASE_COMMIT" \
              > release-commits.txt
          else
            echo "No previous tag found for this channel. Skipping commit range."
          fi

          echo ""
          echo "Commits included in release:"
          cat release-commits.txt

          echo "[]" > release-prs.json

          while IFS= read -r commit_sha; do

            [ -z "$commit_sha" ] && continue

            echo ""
            echo "Checking commit: $commit_sha"

            prs_for_commit=$(gh api \
              "repos/${{ github.repository }}/commits/$commit_sha/pulls" \
              --jq '
                [
                  .[]
                  | {
                      number: .number,
                      title: .title,
                      author: .user.login,
                      authorUrl: .user.html_url,
                      avatarUrl: .user.avatar_url
                    }
                ]
              ')

            if [ -n "$prs_for_commit" ] && [ "$prs_for_commit" != "[]" ]; then

              echo "$prs_for_commit" > current-prs.json

              jq -s 'add' release-prs.json current-prs.json \
                | jq 'unique_by(.number)' \
                > release-prs-new.json

              mv release-prs-new.json release-prs.json

            fi

          done < release-commits.txt

          echo "[]" > release-contributors.json

          compare_ref=""

          if git rev-parse "$COMPARE_FROM" >/dev/null 2>&1; then
            compare_ref="$COMPARE_FROM"
          elif git rev-parse "$PREVIOUS_TAG" >/dev/null 2>&1; then
            compare_ref="$PREVIOUS_TAG"
          fi

          if [ -n "$compare_ref" ]; then
            gh api \
              "repos/${{ github.repository }}/compare/${compare_ref}...${RELEASE_COMMIT}" \
              --jq '
                [
                  .commits[]
                  | .author.login // .committer.login
                  | select(. != null)
                ]
                | unique
              ' \
              > release-contributors.json
          fi

          echo ""
          echo "========================================="
          echo "PRs included in this release"
          echo "========================================="

          cat release-prs.json

          echo ""
          echo "========================================="
          echo "Contributors included in this release"
          echo "========================================="

          cat release-contributors.json

      # --------------------------------------------------
      # Generate GitHub Release notes
      # --------------------------------------------------
      - name: Generate release notes
        env:
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_PR_TITLE: ${{ github.event.pull_request.title }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.latest_tag }}
          COMPARE_FROM: ${{ steps.version.outputs.compare_from }}
          VERSION: ${{ steps.version.outputs.next_version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          SOURCE_BRANCH: ${{ steps.version.outputs.source_branch }}
          TARGET_BRANCH: ${{ steps.version.outputs.target_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export RELEASE_DATE=$(date -u +"%Y-%m-%d")

          python <<'PY'
          import json
          import os

          release_pr_number = os.environ["RELEASE_PR_NUMBER"]
          release_pr_title = os.environ["RELEASE_PR_TITLE"]
          release_date = os.environ["RELEASE_DATE"]
          previous_version = os.environ["PREVIOUS_VERSION"]
          compare_from = os.environ["COMPARE_FROM"]
          version = os.environ["VERSION"]
          channel = os.environ["CHANNEL"]
          source_branch = os.environ["SOURCE_BRANCH"]
          target_branch = os.environ["TARGET_BRANCH"]
          repository = os.environ["REPOSITORY"]

          with open("release-prs.json", "r", encoding="utf-8") as file:
              prs = json.load(file)

          try:
              with open("release-contributors.json", "r", encoding="utf-8") as file:
                  commit_authors = json.load(file)
          except FileNotFoundError:
              commit_authors = []

          if not isinstance(commit_authors, list):
              commit_authors = []

          prs = sorted(prs, key=lambda pr: pr.get("number") or 0)

          contributors = {}

          def add_contributor(login, url=None, avatar=None):
              if not login:
                  return

              if login.endswith("[bot]") or login == "github-actions[bot]":
                  return

              existing = contributors.get(login, {})
              contributors[login] = {
                  "login": login,
                  "url": url or existing.get("url") or f"https://github.com/{login}",
                  "avatar": avatar or existing.get("avatar") or f"https://github.com/{login}.png?size=64",
              }

          for pr in prs:
              add_contributor(
                  pr.get("author"),
                  pr.get("authorUrl"),
                  pr.get("avatarUrl"),
              )

          for login in commit_authors:
              add_contributor(login)

          contributor_list = sorted(
              contributors.values(),
              key=lambda item: item["login"].lower(),
          )

          lines = []

          lines.append("## Release Information")
          lines.append("")
          lines.append(
              f"- **Release PR:** #{release_pr_number} — {release_pr_title}"
          )
          lines.append(f"- **Release Date:** {release_date}")
          lines.append(f"- **Channel:** `{channel}`")
          lines.append(f"- **Source Branch:** `{source_branch}`")
          lines.append(f"- **Target Branch:** `{target_branch}`")
          lines.append("")

          lines.append("## Pull Requests")
          lines.append("")

          if not prs:
              lines.append(
                  "No pull requests were included in this release."
              )
              lines.append("")
          else:
              for pr in prs:
                  number = pr.get("number")
                  title = pr.get("title") or "Untitled PR"
                  author = pr.get("author")

                  if author:
                      lines.append(
                          f"- #{number} — {title} — [@{author}](https://github.com/{author})"
                      )
                  else:
                      lines.append(f"- #{number} — {title}")

              lines.append("")

          lines.append("## Full Changelog")
          lines.append("")
          lines.append(
              f"**Full Changelog:** [{compare_from}...{version}]"
              f"(https://github.com/{repository}/compare/{compare_from}...{version})"
          )
          lines.append("")
          lines.append(
              f"Comparison is based on the source branch `{source_branch}` "
              f"(from `{compare_from}` to `{version}`). "
              f"Previous `{channel}` tag was `{previous_version}`."
          )
          lines.append("")

          lines.append("## Contributors")
          lines.append("")

          if not contributor_list:
              lines.append("No contributors were identified for this release.")
              lines.append("")
          else:
              avatar_parts = []

              for contributor in contributor_list:
                  login = contributor["login"]
                  url = contributor["url"]
                  avatar = contributor["avatar"]
                  avatar_parts.append(
                      f'<a href="{url}">'
                      f'<img src="{avatar}" width="48" height="48" alt="@{login}"/>'
                      f"</a>"
                  )

              lines.append(" ".join(avatar_parts))
              lines.append("")
              lines.append(
                  " ".join(
                      f"[@{item['login']}]({item['url']})"
                      for item in contributor_list
                  )
              )
              lines.append("")

          release_notes = "\n".join(lines).strip() + "\n"

          with open("release-notes.md", "w", encoding="utf-8") as file:
              file.write(release_notes)

          print("")
          print("=========================================")
          print("Generated GitHub Release Notes")
          print("=========================================")
          print("")
          print(release_notes)
          PY

      # --------------------------------------------------
      # Create release tag on the target branch only
      # --------------------------------------------------
      - name: Create release tag
        env:
          VERSION: ${{ steps.version.outputs.next_version }}
          TARGET_BRANCH: ${{ steps.version.outputs.target_branch }}
        run: |
          echo "Creating tag: $VERSION on $TARGET_BRANCH"

          git fetch origin "$TARGET_BRANCH"

          git checkout "$TARGET_BRANCH"

          git reset --hard "origin/$TARGET_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$VERSION"

          git push origin "$VERSION"

          echo "Tag $VERSION created on $TARGET_BRANCH."

      # --------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next_version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          extra_args=()

          if [ "$PRERELEASE" = "true" ]; then
            extra_args+=(--prerelease)
          fi

          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes-file release-notes.md \
            "${extra_args[@]}"

          echo "GitHub Release $VERSION created successfully."
